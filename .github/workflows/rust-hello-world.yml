name: Build unlisted Rust hello-world image

on:
  workflow_dispatch:

permissions:
  attestations: write
  contents: read
  id-token: write

jobs:
  image:
    uses: proof-computer/liskov-github-actions/.github/workflows/cargo-runtime-image.yml@v2
    with:
      application-id: rust-hello-world-v5
      manifest-path: rust-hello-world/.liskov/rust-hello-world.v5.json
      working-directory: rust-hello-world
      binary-name: rust-hello-world
      install-path: /usr/local/bin/rust-hello-world
      base-image-url: https://github.com/proof-computer/liskov-runtime-images/releases/download/v0.1.0-rc.13/liskov-runtime-image-debian-trixie-snapshot-aarch64.tar.xz
      base-image-sha256: ac69afc5c8737db519f653f42f150c814cfd2c1173bececa15fc32258a8e2f9a
      base-attestation-repository: proof-computer/liskov-runtime-images
      base-attestation-source-digest: e061dfd03f430657b4e937d91cfc804b1670d0f5
      base-attestation-signer-workflow: proof-computer/liskov-runtime-images/.github/workflows/ci.yml
